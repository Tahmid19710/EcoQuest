name: EcoQuest CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run environmental simulation tests
        run: npm test

      - name: Build the game
        run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend test dependency
        run: python -m pip install "pandas>=2.2,<3.0"

      - name: Run backend unit tests
        working-directory: ml_backend
        run: python -m unittest discover -s tests -v
