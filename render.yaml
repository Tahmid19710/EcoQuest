services:
  - type: web
    name: ecoquest-flood-api
    runtime: python
    rootDir: ml_backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ECOQUEST_CORS_ORIGINS
        value: https://ecoquest-tahmid.vercel.app
